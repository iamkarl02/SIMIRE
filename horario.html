<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Horario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Botón hamburguesa -->
<button class="menu-btn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false" aria-controls="menuOverlay">
  <span></span><span></span><span></span>
</button>

<!-- Menú overlay a pantalla completa -->
<div class="menu-overlay" id="menuOverlay" role="dialog" aria-modal="true" aria-label="Menú principal" hidden>
  <nav class="menu-nav">
    <a class="menu-item" href="#" data-action="hoy">
      <span class="menu-index">01</span>
      <span class="menu-label">Hoy</span>
      <span class="menu-sub">Ir al día actual</span>
    </a>
    <a class="menu-item" href="#" data-action="semana">
      <span class="menu-index">02</span>
      <span class="menu-label">Semana</span>
      <span class="menu-sub">Vista completa L–V</span>
    </a>
    <a class="menu-item" href="#" data-action="recargar">
      <span class="menu-index">03</span>
      <span class="menu-label">Recargar</span>
      <span class="menu-sub">Volver a leer horario.txt</span>
    </a>
    <a class="menu-item" href="#" data-action="tema">
      <span class="menu-index">04</span>
      <span class="menu-label">Tema</span>
      <span class="menu-sub">Claro / oscuro / sistema</span>
    </a>
    <a class="menu-item" href="#" data-action="acerca">
      <span class="menu-index">05</span>
      <span class="menu-label">Acerca de</span>
      <span class="menu-sub">Información del horario</span>
    </a>
  </nav>
  <div class="menu-footer">
    <span>Horario · Portal del empleado</span>
    <span id="menuClock">—</span>
  </div>
</div>

<!-- Selector de días (móvil) -->
<nav class="days" id="daysNav" aria-label="Seleccionar día"></nav>

<!-- Contenido principal -->
<main>
  <div class="week" id="weekView"></div>
  <div class="mobile" id="mobileView"></div>
</main>

<!-- Widget de tiempo flotante -->
<div class="time-widget" role="status" aria-live="polite">
  <div class="ring" id="ring">
    <svg viewBox="0 0 40 40">
      <circle class="bg" cx="20" cy="20" r="17"></circle>
      <circle class="fg" cx="20" cy="20" r="17"></circle>
    </svg>
    <span class="ring-label" id="ringLabel">—</span>
  </div>
  <div class="meta">
    <span class="now" id="nowLabel">Cargando…</span>
    <span class="time" id="timeLabel"></span>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
