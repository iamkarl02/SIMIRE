<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Interactivo - Montaje y Mantenimiento de Equipos</title>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #edf2f7 100%);
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --success-bg: #ecfdf5;
    --success-border: #10b981;
    --success-text: #065f46;
    --error-bg: #fef2f2;
    --error-border: #ef4444;
    --error-text: #991b1b;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    --radius: 16px;
  }

  [data-theme="dark"] {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    --card-bg: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --success-bg: #064e3b;
    --success-border: #34d399;
    --success-text: #d1fae5;
    --error-bg: #7f1d1d;
    --error-border: #f87171;
    --error-text: #fee2e2;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    min-height: 100vh;
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
  }

  /* Header & Theme toggle */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    background: var(--card-bg);
    padding: 16px 20px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .logo-area h1 {
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-area p {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .theme-toggle {
    background: transparent;
    border: 2px solid var(--text-muted);
    color: var(--text-main);
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    transition: all 0.2s;
  }
  .theme-toggle:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Controls Panel */
  .controls-panel {
    background: var(--card-bg);
    padding: 24px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 24px;
    display: grid;
    gap: 16px;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .control-group label {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-muted);
  }

  select, button.btn {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 2px solid rgba(100, 116, 139, 0.2);
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--card-bg);
    color: var(--text-main);
    outline: none;
    transition: all 0.2s;
  }

  select:focus, select:hover {
    border-color: var(--accent);
  }

  .btn-primary {
    background: var(--accent);
    color: white;
    border: none;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
  }
  .btn-primary:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }
  .btn-primary:active {
    transform: translateY(0);
  }

  /* Stats / Progress Bar */
  .quiz-header {
    display: none;
    background: var(--card-bg);
    padding: 16px 20px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .stat-badge {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text-main);
    background: rgba(59, 130, 246, 0.1);
    padding: 6px 12px;
    border-radius: 20px;
  }

  .progress-container {
    width: 100%;
    height: 8px;
    background: rgba(100, 116, 139, 0.15);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 8px;
    display: none;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }

  /* Question Card */
  #quiz-container {
    display: none;
  }

  .question-card {
    background: var(--card-bg);
    padding: 24px 20px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .meta-tag {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: rgba(99, 102, 241, 0.1);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 6px;
    margin-bottom: 12px;
  }

  .question-text {
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1.45;
    margin-bottom: 20px;
    color: var(--text-main);
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    border-radius: 12px;
    border: 2px solid rgba(100, 116, 139, 0.15);
    background: var(--card-bg);
    color: var(--text-main);
    font-size: 0.95rem;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    line-height: 1.4;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(59, 130, 246, 0.04);
    transform: translateX(2px);
  }

  .option-btn:disabled {
    cursor: default;
  }

  .option-btn.correct {
    background: var(--success-bg) !important;
    border-color: var(--success-border) !important;
    color: var(--success-text) !important;
    font-weight: 700;
  }

  .option-btn.incorrect {
    background: var(--error-bg) !important;
    border-color: var(--error-border) !important;
    color: var(--error-text) !important;
  }

  .explanation-box {
    display: none;
    margin-top: 20px;
    padding: 16px;
    background: rgba(59, 130, 246, 0.06);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--text-main);
  }

  .explanation-box.visible {
    display: block;
    animation: fadeIn 0.3s ease;
  }

  .nav-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    gap: 12px;
  }

  .btn-nav {
    padding: 10px 20px;
    border-radius: 10px;
    border: 2px solid rgba(100, 116, 139, 0.2);
    background: var(--card-bg);
    color: var(--text-main);
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
  }
  .btn-nav:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn-nav:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Results Screen */
  #results-screen {
    display: none;
    background: var(--card-bg);
    padding: 32px 24px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    text-align: center;
  }

  #results-screen h2 {
    font-size: 1.75rem;
    margin-bottom: 12px;
  }

  #results-screen p {
    font-size: 1.1rem;
    color: var(--text-muted);
    margin-bottom: 24px;
  }

  .score-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(59, 130, 246, 0.1);
    border: 6px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-size: 2rem;
    font-weight: 800;
    color: var(--accent);
  }

  /* Responsive tweaks */
  @media (min-width: 640px) {
    body { padding: 32px 20px; }
    .container { max-width: 680px; }
    .question-card { padding: 32px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo-area">
      <h1>🛠️ Test SIMIRE 2026</h1>
      <p>Montaje y Mantenimiento de Equipos</p>
    </div>
    <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()">🌙 Oscuro</button>
  </header>

  <!-- Controls Screen -->
  <div class="controls-panel" id="setup-panel">
    <div class="control-group">
      <label for="cat-select">📂 Bloque / Categoría de Preguntas:</label>
      <select id="cat-select">
        <option value="todas">Todas las preguntas (89 total)</option>
        <option value="test80">📖 Test Oficiales (80 preguntas)</option>
        <option value="practicas">🛠️ Supuestos Prácticos Examen (9 preguntas)</option>
        <option value="tema21">2.1 Arquitectura Von Neumann</option>
        <option value="tema22">2.2 Chipset</option>
        <option value="tema23">2.3 Buses</option>
        <option value="tema24">2.4 Componentes básicos</option>
      </select>
    </div>

    <div class="control-group">
      <label for="order-select">🔀 Orden de las preguntas:</label>
      <select id="order-select">
        <option value="orden">Secuencial (en orden)</option>
        <option value="azar" selected>Aleatorio (al azar)</option>
      </select>
    </div>

    <button class="btn btn-primary" onclick="iniciarQuiz()">🚀 Comenzar Cuestionario</button>
  </div>

  <!-- Quiz Header (Score & Progress) -->
  <div class="quiz-header" id="quiz-header">
    <div class="stat-badge" id="stat-counter">Pregunta 1 / 89</div>
    <div class="stat-badge" id="stat-score">✅ Aciertos: 0</div>
  </div>
  <div class="progress-container" id="progress-container">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>

  <!-- Quiz Question Card -->
  <div id="quiz-container">
    <div class="question-card" id="card-body">
      <div class="meta-tag" id="card-tag">Tema</div>
      <div class="question-text" id="card-question">Cargando pregunta...</div>
      <div class="options-list" id="card-options"></div>
      <div class="explanation-box" id="card-explanation"></div>
      
      <div class="nav-buttons">
        <button class="btn-nav" id="btn-prev" onclick="preguntaAnterior()" disabled>⬅️ Anterior</button>
        <button class="btn-nav" id="btn-next" onclick="siguientePregunta()" disabled>Siguiente ➡️</button>
      </div>
    </div>
  </div>

  <!-- Results Screen -->
  <div id="results-screen">
    <h2>🎉 ¡Cuestionario Completado!</h2>
    <div class="score-circle" id="final-score-circle">0%</div>
    <p id="final-message">Has finalizado todas las preguntas con éxito.</p>
    <button class="btn btn-primary" onclick="reiniciarSetup()">🔄 Volver al Menú Principal</button>
  </div>
</div>

<script>
// Preguntas integradas directamente en el código (89 en total)
const TODAS_LAS_PREGUNTAS = [{"id": 1, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "¿Cuál es el rasgo definitorio fundamental de la arquitectura Von Neumann?", "opciones": ["A) El uso de memorias físicamente separadas para datos e instrucciones.", "B) El empleo de una única memoria compartida tanto para datos como para instrucciones.", "C) La ejecución de varias instrucciones de forma simultánea e independiente."], "respuesta_correcta": "B", "explicacion": "La arquitectura Von Neumann se fundamenta en una única memoria compartida donde residen conjuntamente los datos y las instrucciones del programa."}, {"id": 2, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "¿Cómo se denomina el ciclo repetitivo que ejecuta la CPU en este modelo?", "opciones": ["A) Ciclo de interrupción-procesamiento-almacenamiento.", "B) Ciclo de lectura-escritura-actualización.", "C) Ciclo de búsqueda-decodificación-ejecución (fetch-decode-execute)."], "respuesta_correcta": "C", "explicacion": "La CPU ejecuta de forma continua el ciclo conocido como búsqueda-decodificación-ejecución (fetch-decode-execute)."}, {"id": 3, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "En la arquitectura Von Neumann, ¿qué establece el principio de memoria única?", "opciones": ["A) Que el código y los datos residen en el mismo espacio de direcciones.", "B) Que solo existe un registro interno para almacenar resultados.", "C) Que la memoria RAM no puede comunicarse simultáneamente con los periféricos."], "respuesta_correcta": "A", "explicacion": "El principio de memoria única establece que tanto el código de los programas como los datos ocupan el mismo espacio de direcciones."}, {"id": 4, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "¿Qué determina el principio de secuencialidad en esta arquitectura?", "opciones": ["A) Las operaciones de la ALU deben ser siempre sumas antes que operaciones lógicas.", "B) Las instrucciones se ejecutan una tras otra, salvo que una instrucción de salto altere el flujo.", "C) La memoria debe paginarse de menor a mayor dirección física de manera fija."], "respuesta_correcta": "B", "explicacion": "En Von Neumann, las instrucciones se procesan secuencialmente una tras otra salvo que una instrucción de salto modifique el flujo de control."}, {"id": 5, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "¿Cuál es la función específica de la Unidad de Control (CU)?", "opciones": ["A) Almacenar de forma permanente las instrucciones del sistema operativo.", "B) Realizar los cálculos lógicos y aritméticos requeridos por el programa.", "C) Generar las señales de control que coordinan los pasos del ciclo del procesador."], "respuesta_correcta": "C", "explicacion": "La Unidad de Control (CU) tiene como cometido coordinar los pasos del ciclo de procesamiento mediante la generación de señales de control."}, {"id": 6, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "¿Qué misión cumple la Unidad Aritmético-Lógica (ALU)?", "opciones": ["A) Decodificar la siguiente instrucción contenida en la memoria RAM.", "B) Ejecutar operaciones aritméticas y lógicas sobre los operandos.", "C) Conectar físicamente la placa de pruebas con los buses del sistema."], "respuesta_correcta": "B", "explicacion": "La Unidad Aritmético-Lógica (ALU) es el bloque encargado de realizar cálculos aritméticos y operaciones lógicas sobre los datos."}, {"id": 7, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "¿Qué son los registros en el procesador según el modelo Von Neumann?", "opciones": ["A) Pequeñas áreas de almacenamiento interno que aceleran el procesamiento.", "B) Líneas de cableado físico que unen la CPU con los módulos externos.", "C) Dispositivos de almacenamiento masivo basados en semiconductores."], "respuesta_correcta": "A", "explicacion": "Los registros son pequeñas áreas de memoria interna dentro del procesador (como PC, IR o AC) destinadas a acelerar la ejecución de tareas."}, {"id": 8, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "¿En qué consiste el denominado «cuello de botella de Von Neumann»?", "opciones": ["A) En la imposibilidad de ejecutar instrucciones de salto dentro del mismo espacio de memoria.", "B) En que la CPU compite con la memoria por el mismo bus, ralentizando el acceso a datos e instrucciones.", "C) En el sobrecalentamiento producido por el uso simultáneo de la ALU y la CU."], "respuesta_correcta": "B", "explicacion": "Dicho cuello de botella se produce porque la CPU debe compartir el mismo bus con la memoria tanto para leer instrucciones como para leer/escribir datos, ralentizando el tráfico."}, {"id": 9, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "En el ámbito del montaje y mantenimiento de equipos, ¿a qué hace referencia la «sintaxis» de la arquitectura?", "opciones": ["A) A la representación gráfica y simbólica de los componentes y sus interconexiones.", "B) Al lenguaje binario que utiliza la máquina hipotética.", "C) Al protocolo de comunicación serie utilizado por los periféricos."], "respuesta_correcta": "A", "explicacion": "En el contexto de montaje de equipos, la sintaxis hace referencia a cómo se representan gráfica y simbólicamente los componentes y sus conexiones."}, {"id": 10, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "Al realizar el cableado en una placa de prueba, ¿qué pines se deben identificar primero en el controlador de memoria?", "opciones": ["A) Los pines de reloj y alimentación de la placa.", "B) Los pines de dirección y de datos, que forman los buses.", "C) Los pines de reinicio y parada forzada del sistema."], "respuesta_correcta": "B", "explicacion": "El truco práctico indica localizar en primer lugar los pines de dirección y de datos del controlador de memoria, ya que constituyen los buses del sistema."}, {"id": 11, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "¿Qué información almacena el Contador de Programa (PC)?", "opciones": ["A) La instrucción binaria completa que se está decodificando.", "B) El código de operación que ejecutará la ALU a continuación.", "C) La dirección de la siguiente instrucción a ejecutar."], "respuesta_correcta": "C", "explicacion": "El Contador de Programa (Program Counter o PC) almacena la dirección de memoria donde se encuentra la siguiente instrucción a procesar."}, {"id": 12, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "En microcontroladores de 8 bits, ¿cómo suele estar implementado físicamente el registro PC según el texto?", "opciones": ["A) Como un registro de 8 bits con salida PC_in.", "B) Como un registro de 16 bits asociado a la señal PC_out.", "C) Como una posición reservada de la memoria ROM accesible por software."], "respuesta_correcta": "B", "explicacion": "El material señala que en microcontroladores de 8 bits el PC suele implementarse como un registro de 16 bits y emite la señal PC_out."}, {"id": 13, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "¿Cuál es la función del Registro de Instrucción (IR)?", "opciones": ["A) Servir de acumulador temporal para resultados lógicos de la ALU.", "B) Contener la instrucción que se está decodificando en el ciclo actual.", "C) Guardar la dirección del siguiente bloque de datos en la memoria RAM."], "respuesta_correcta": "B", "explicacion": "El Registro de Instrucción (Instruction Register o IR) retiene la instrucción que se encuentra actualmente en fase de decodificación."}, {"id": 14, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "¿Hacia dónde se dirige la salida del Registro de Instrucción (IR)?", "opciones": ["A) Alimenta directamente la lógica de decodificación de la Unidad de Control.", "B) Entra en el acumulador para realizar comprobaciones de paridad.", "C) Se vuelca de manera directa al bus de direcciones."], "respuesta_correcta": "A", "explicacion": "La salida del registro IR se conecta directamente con los circuitos de lógica de decodificación de la Unidad de Control (CU)."}, {"id": 15, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "¿Qué papel cumple el Acumulador (AC)?", "opciones": ["A) Es el registro principal de la ALU para operandos y resultados.", "B) Es el módulo encargado de generar la señal de carga IR_load.", "C) Es el bus secundario que interconecta la RAM con los periféricos."], "respuesta_correcta": "A", "explicacion": "El Acumulador (AC) es el registro básico de la ALU que retiene operandos antes del cómputo y almacena los resultados directos."}, {"id": 16, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "En el montaje práctico, ¿qué consecuencia tiene un contacto sucio en los pines de entrada de la ALU?", "opciones": ["A) La sobretensión instantánea del registro PC.", "B) El borrado completo de la memoria DIP-SRAM.", "C) La obtención de resultados erróneos en sus operaciones."], "respuesta_correcta": "C", "explicacion": "El texto advierte explícitamente de que una mala soldadura o un contacto sucio en las entradas de datos de la ALU provocará resultados erróneos."}, {"id": 17, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "En placas de montaje, ¿en qué encapsulado suele presentarse comúnmente la memoria RAM?", "opciones": ["A) En formato DIP-SRAM.", "B) En módulos BGA soldados.", "C) En tarjetas extraíbles DIMM de alta velocidad."], "respuesta_correcta": "A", "explicacion": "En las placas y entornos de montaje de prueba descritos, la memoria RAM suele implementarse mediante circuitos integrados con encapsulado DIP-SRAM."}, {"id": 18, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "¿Qué recomendación técnica de cableado se ofrece para los buses y cuál es su finalidad?", "opciones": ["A) Utilizar cables apantallados de par trenzado para suprimir ruidos de alta frecuencia.", "B) Usar cables de calibre 22-AWG para evitar retardos por capacitancia.", "C) Emplear pistas de cobre para reducir la inductancia de la ALU."], "respuesta_correcta": "B", "explicacion": "Se recomienda emplear cables de calibre 22-AWG para los buses con el objetivo técnico de evitar retardos provocados por la capacitancia."}, {"id": 19, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "En sistemas reales, ¿qué efecto tiene la separación física de los buses de datos y de direcciones?", "opciones": ["A) Invalida por completo el modelo conceptual de Von Neumann.", "B) Reduce el consumo energético global al prescindir de la señal Ctrl.", "C) Mejora la velocidad, manteniendo intacto el modelo conceptual de Von Neumann."], "respuesta_correcta": "C", "explicacion": "Emplear buses físicos separados para datos y direcciones incrementa el rendimiento, pero la estructura y lógica conceptual de Von Neumann sigue siendo la misma."}, {"id": 20, "tema": "2.1 Arquitectura Von Neumann", "pregunta": "En la máquina hipotética del simulador presentado en el documento, ¿cuáles son las características de palabra y dirección?", "opciones": ["A) 16 bits de palabra y 32 bits de dirección.", "B) 8 bits de palabra y 16 bits de dirección.", "C) 8 bits de palabra y 8 bits de dirección."], "respuesta_correcta": "B", "explicacion": "El simulador interactivo ilustra el ciclo de funcionamiento sobre una máquina teórica estructurada con 8 bits de palabra y 16 bits de dirección."}, {"id": 21, "tema": "2.2 Chipset", "pregunta": "¿Cuál es la función principal del chipset en un ordenador?", "opciones": ["A) Proporcionar exclusivamente alimentación eléctrica a la placa base y a los módulos de memoria.", "B) Controlar la comunicación entre el procesador y los demás componentes del equipo.", "C) Sustituir al firmware UEFI en la carga del sistema operativo."], "respuesta_correcta": "B", "explicacion": "El chipset es el conjunto de circuitos que controla la comunicación de la CPU con la RAM, almacenamiento, tarjetas de expansión y puertos de E/S."}, {"id": 22, "tema": "2.2 Chipset", "pregunta": "En la arquitectura tradicional de PC, ¿qué elementos gestiona el Northbridge?", "opciones": ["A) Los dispositivos de entrada/salida como puertos SATA, USB, audio y red.", "B) El acceso a la memoria RAM, el bus del procesador y el control de PCI-Express.", "C) Exclusivamente el arranque del sistema y el almacenamiento secundario."], "respuesta_correcta": "B", "explicacion": "En la arquitectura tradicional, el Northbridge gestiona el acceso a la RAM, el bus de la CPU, PCIe y, a veces, la GPU integrada."}, {"id": 23, "tema": "2.2 Chipset", "pregunta": "¿Qué funciones desempeña el Southbridge en la arquitectura clásica?", "opciones": ["A) Gestionar los dispositivos de entrada/salida: SATA, USB, audio, red, etc.", "B) Controlar directamente la memoria RAM y el bus principal del procesador.", "C) Integrar el reloj base del procesador y la memoria caché de nivel 3."], "respuesta_correcta": "A", "explicacion": "El Southbridge es el controlador de E/S y se encarga de interfaces como SATA, USB, audio y red."}, {"id": 24, "tema": "2.2 Chipset", "pregunta": "¿Con qué otro nombre técnico se denomina tradicionalmente al Northbridge?", "opciones": ["A) Controlador de periféricos.", "B) Controlador de E/S.", "C) Controlador de memoria."], "respuesta_correcta": "C", "explicacion": "El Northbridge se conoce también técnicamente como controlador de memoria."}, {"id": 25, "tema": "2.2 Chipset", "pregunta": "En los diseños de procesadores modernos (como Intel 2000 o AMD Zen), ¿dónde se ha integrado la mayor parte de las funciones del Northbridge?", "opciones": ["A) En la propia CPU.", "B) En el módulo TPM de la placa base.", "C) En una tarjeta de expansión PCI-Express secundaria."], "respuesta_correcta": "A", "explicacion": "En arquitecturas modernas, la gran mayoría de funciones del Northbridge han pasado a integrarse dentro del encapsulado del procesador."}, {"id": 26, "tema": "2.2 Chipset", "pregunta": "¿Cómo denomina Intel a su chipset en las arquitecturas modernas?", "opciones": ["A) FCH (Fusion Controller Hub).", "B) PCH (Platform Controller Hub).", "C) IOH (Input Output Hub)."], "respuesta_correcta": "B", "explicacion": "Intel denomina PCH (Platform Controller Hub) a su chipset actual al haber absorbido la CPU gran parte del Northbridge."}, {"id": 27, "tema": "2.2 Chipset", "pregunta": "¿Qué nombre recibe el chipset en las arquitecturas modernas de AMD?", "opciones": ["A) FCH (Fusion Controller Hub).", "B) PCH (Platform Controller Hub).", "C) APU (Accelerated Processing Unit)."], "respuesta_correcta": "A", "explicacion": "AMD utiliza las siglas FCH (Fusion Controller Hub) para designar su bloque de chipset."}, {"id": 28, "tema": "2.2 Chipset", "pregunta": "¿Qué diferencia conceptual existe entre el chipset y la placa base?", "opciones": ["A) Son términos completamente sinónimos que describen el mismo circuito integrado.", "B) La placa base incluye el chipset, el trazado de pistas, los conectores físicos y el firmware.", "C) El chipset contiene los conectores físicos externos y la placa base solo los buses de datos."], "respuesta_correcta": "B", "explicacion": "La placa base es el soporte físico completo que integra el chipset junto a pistas, conectores y el firmware (BIOS/UEFI)."}, {"id": 29, "tema": "2.2 Chipset", "pregunta": "En la denominación de un chipset, ¿a qué hace referencia la «Serie»?", "opciones": ["A) Al socket exacto en el que encaja mecánicamente el procesador.", "B) A un grupo de productos con un mismo conjunto de características básicas.", "C) Al número total de pistas PCIe que gestiona la CPU."], "respuesta_correcta": "B", "explicacion": "La serie agrupa conjuntos de chipsets que comparten las mismas características y prestaciones básicas."}, {"id": 30, "tema": "2.2 Chipset", "pregunta": "Según la nomenclatura descrita, ¿cuáles son series habituales de Intel y AMD respectivamente?", "opciones": ["A) Series Z, H, B en Intel y X, B, A en AMD.", "B) Series X, B, A en Intel y Z, H, B en AMD.", "C) Series LGA en Intel y AM en AMD."], "respuesta_correcta": "A", "explicacion": "El texto señala las series Z, H y B para el fabricante Intel, y las series X, B y A para AMD."}, {"id": 31, "tema": "2.2 Chipset", "pregunta": "¿Qué indica el «Número de generación» en la denominación de un chipset?", "opciones": ["A) La cantidad máxima de líneas PCI-Express aportadas por la placa base.", "B) La generación del chipset, que habitualmente coincide con la del procesador.", "C) La velocidad en gigahercios a la que trabaja el controlador de memoria."], "respuesta_correcta": "B", "explicacion": "El número indica la generación a la que pertenece el chipset, que suele asociarse con la generación correspondiente de CPU."}, {"id": 32, "tema": "2.2 Chipset", "pregunta": "En la denominación de un modelo de chipset (por ejemplo, Z790K), ¿qué indica una letra opcional como la «K»?", "opciones": ["A) Variantes especiales, como la orientación al overclocking.", "B) Que es un chipset exclusivo para ordenadores portátiles de bajo consumo.", "C) La incompatibilidad con almacenamiento de tipo SATA."], "respuesta_correcta": "A", "explicacion": "Los sufijos o letras opcionales hacen referencia a variantes especiales, como la letra <<K>> para funciones de overclocking."}, {"id": 33, "tema": "2.2 Chipset", "pregunta": "¿Qué comprobación es indispensable realizar para asegurar la compatibilidad entre el chipset y la CPU?", "opciones": ["A) Verificar siempre que el socket del chipset coincida con el de la CPU.", "B) Comprobar que el número de puertos SATA sea superior a ocho.", "C) Asegurar que el procesador tenga el mismo número de modelo que el chipset."], "respuesta_correcta": "A", "explicacion": "Es una regla básica confirmar que el socket del chipset coincida con el socket que requiere el procesador a instalar."}, {"id": 34, "tema": "2.2 Chipset", "pregunta": "¿Con qué socket está asociado el chipset Intel Z790 según la tabla de propiedades?", "opciones": ["A) AM5.", "B) LGA 1700.", "C) AM4."], "respuesta_correcta": "B", "explicacion": "Según la tabla comparativa, el chipset Intel Z790 utiliza el socket LGA 1700."}, {"id": 35, "tema": "2.2 Chipset", "pregunta": "¿Cuántas líneas PCIe propias aporta el chipset (PCH) en el modelo Intel Z790?", "opciones": ["A) 24 líneas.", "B) 28 líneas.", "C) 16 líneas."], "respuesta_correcta": "A", "explicacion": "El modelo Z790 proporciona 24 líneas PCIe desde el propio PCH (además de las 28 de la CPU de 13.º generación)."}, {"id": 36, "tema": "2.2 Chipset", "pregunta": "¿Cuál de las siguientes es una característica propia del chipset Intel B660 según la documentación técnica?", "opciones": ["A) Soporte para overclocking total y memoria DDR5-6600.", "B) Ausencia de overclocking, soporte DDR4/DDR5 y enfoque para equipos de oficina.", "C) Incorporación exclusiva de conectividad USB 3.2 Gen 2x2."], "respuesta_correcta": "B", "explicacion": "El chipset B660 no incluye capacidades de overclocking, admite DDR4/DDR5 y está orientado como opción económica de oficina."}, {"id": 37, "tema": "2.2 Chipset", "pregunta": "¿Qué soporte máximo de memoria DDR5 ofrece el chipset AMD X670E según la tabla comparativa?", "opciones": ["A) DDR5-5200.", "B) DDR5-5600.", "C) DDR5-6600."], "respuesta_correcta": "C", "explicacion": "La tabla técnica detalla que el chipset AMD X670E admite velocidades de memoria DDR5 de hasta 6600 MT/s."}, {"id": 38, "tema": "2.2 Chipset", "pregunta": "¿En qué componentes admite tecnología PCIe 5.0 el chipset AMD X670E?", "opciones": ["A) En la GPU y el SSD.", "B) Únicamente en los puertos de red y audio.", "C) Exclusivamente en las conexiones de los puertos USB."], "respuesta_correcta": "A", "explicacion": "El chipset X670E destaca por implementar carriles PCIe 5.0 orientados a la tarjeta gráfica (GPU) y al almacenamiento sólido (SSD)."}, {"id": 39, "tema": "2.2 Chipset", "pregunta": "¿Con qué serie de procesadores es compatible el chipset AMD B550 según las especificaciones técnicas?", "opciones": ["A) Únicamente con CPUs AMD de socket AM5.", "B) Con CPUs Ryzen 3000-5000.", "C) Con procesadores Intel Core de 13.ª generación."], "respuesta_correcta": "B", "explicacion": "La tabla de propiedades especifica que el chipset AMD B550 (socket AM4) es compatible con la serie Ryzen 3000-5000."}, {"id": 40, "tema": "2.2 Chipset", "pregunta": "¿Cuántos puertos SATA (a 6 Gb/s) proporciona el chipset AMD B550 según la tabla de propiedades?", "opciones": ["A) 8 puertos.", "B) 4 puertos.", "C) 6 puertos."], "respuesta_correcta": "C", "explicacion": "En la tabla comparativa se especifica que el chipset AMD B550 cuenta con 6 puertos de almacenamiento SATA a 6 Gb/s."}, {"id": 41, "tema": "2.3 Buses", "pregunta": "¿Cómo se define un bus en la arquitectura de computadores según el texto?", "opciones": ["A) Como un conjunto de conductores que permite la transmisión de información entre distintos bloques del sistema.", "B) Como un circuito integrado exclusivo para la comunicación entre la memoria RAM y el disco duro.", "C) Como una interfaz de software que gestiona los puertos externos del chasis del ordenador."], "respuesta_correcta": "A", "explicacion": "Un bus se define como un conjunto de conductores (líneas físicas o lógicas) que permite la transmisión de información entre los distintos bloques del sistema."}, {"id": 42, "tema": "2.3 Buses", "pregunta": "En la práctica, ¿de qué forma física se implementa un bus en la placa base?", "opciones": ["A) Como un cable coaxial dedicado para cada componente interno.", "B) Como un único chip controlador con memoria de intercambio propia.", "C) Como una serie de pines que comparten un mismo medio de transmisión."], "respuesta_correcta": "C", "explicacion": "En la práctica se implementa como una serie de pines en la placa base que comparten un mismo medio de transmisión."}, {"id": 43, "tema": "2.3 Buses", "pregunta": "Según el documento, ¿para qué tareas resulta esencial la correcta gestión de los buses?", "opciones": ["A) Para el diseño de páginas web y hojas de estilo en el navegador.", "B) Para el montaje y el mantenimiento de equipos informáticos.", "C) Para la programación de controladores de red de área local."], "respuesta_correcta": "B", "explicacion": "El texto señala textualmente que la correcta gestión de los buses es esencial para el montaje y el mantenimiento de equipos informáticos."}, {"id": 44, "tema": "2.3 Buses", "pregunta": "En la sintaxis descriptiva de hardware expuesta en el tema, ¿cuáles son los campos que definen un bus?", "opciones": ["A) tipo, ancho, velocidad y conectores.", "B) nombre, longitud, voltaje e interfaz.", "C) protocolo, latencia, frecuencia y ranuras."], "respuesta_correcta": "A", "explicacion": "La sintaxis simplificada define cuatro propiedades: tipo, ancho, velocidad y conectores."}, {"id": 45, "tema": "2.3 Buses", "pregunta": "En el ejemplo de hoja de datos para el bus PCIe que se muestra en la sintaxis, ¿qué valor tiene el campo «tipo»?", "opciones": ["A) control", "B) data", "C) address"], "respuesta_correcta": "B", "explicacion": "En el bloque del ejemplo real se especifica textualmente tipo: data;."}, {"id": 46, "tema": "2.3 Buses", "pregunta": "Según la extracción de la hoja de datos del bus PCIe proporcionada, ¿qué valor se indica para su velocidad?", "opciones": ["A) 100", "B) 33", "C) 2500"], "respuesta_correcta": "C", "explicacion": "En la notación del ejemplo PCIe se indica el parámetro velocidad: 2500;."}, {"id": 47, "tema": "2.3 Buses", "pregunta": "En el ejemplo de sintaxis del bus PCIe, ¿qué elementos aparecen listados en el parámetro «conectores»?", "opciones": ["A) [CPU, GPU, SSD]", "B) [CPU, RAM, HDD]", "C) [Placa base, Chipset, GPU]"], "respuesta_correcta": "A", "explicacion": "El ejemplo del texto detalla la lista de conectores como [CPU, GPU, SSD]."}, {"id": 48, "tema": "2.3 Buses", "pregunta": "De acuerdo con la tabla de propiedades, ¿qué describe la propiedad «Ancho»?", "opciones": ["A) La distancia en milímetros entre las pistas de cobre de la placa base.", "B) El número de bits que el bus puede transportar simultáneamente.", "C) La tasa de transferencia medida en megahercios por segundo."], "respuesta_correcta": "B", "explicacion": "La tabla de propiedades define «Ancho» como el número de bits que el bus puede transportar simultáneamente."}, {"id": 49, "tema": "2.3 Buses", "pregunta": "Según la tabla de propiedades, ¿cuáles son los valores típicos para el ancho de un bus?", "opciones": ["A) 1, 2, 4, 8 bits.", "B) 128, 256, 512, 1024 bits.", "C) 8, 16, 32, 64 bits."], "respuesta_correcta": "C", "explicacion": "Los valores típicos recogidos en la tabla para el ancho son 8, 16, 32 y 64 bits."}, {"id": 50, "tema": "2.3 Buses", "pregunta": "¿Cuáles son los valores típicos que puede tomar la propiedad «Tipo» según la tabla de propiedades?", "opciones": ["A) data, address, control", "B) serie, paralelo, mixto", "C) síncrono, asíncrono, diferencial"], "respuesta_correcta": "A", "explicacion": "La clasificación por función o tipo contempla los valores data, address y control."}, {"id": 51, "tema": "2.3 Buses", "pregunta": "¿Cuáles de los siguientes estándares se citan como ejemplos comerciales en la tabla de propiedades?", "opciones": ["A) SATA, SCSI, IDE, NVMe.", "B) ISA, PCI, PCI-Express, USB.", "C) AGP, AMR, CNR, VESA."], "respuesta_correcta": "B", "explicacion": "Los ejemplos comerciales citados en la tabla son ISA, PCI, PCI-Express y USB."}, {"id": 52, "tema": "2.3 Buses", "pregunta": "Según la tabla de propiedades, ¿qué indica la propiedad «Dirección»?", "opciones": ["A) La ruta hexadecimal de la memoria donde residen los datos.", "B) El sentido físico de la corriente eléctrica por las pistas.", "C) En qué parte del sistema se origina o termina la comunicación."], "respuesta_correcta": "C", "explicacion": "La tabla define la propiedad «Dirección» como la indicación de en qué parte del sistema se origina o termina el bus (p. ej., CPU → Memoria)."}, {"id": 53, "tema": "2.3 Buses", "pregunta": "Cuando el ancho del bus es insuficiente para la carga de trabajo, ¿dónde suele originarse el cuello de botella?", "opciones": ["A) En el bus de datos.", "B) En el bus de direcciones.", "C) En el bus de control."], "respuesta_correcta": "A", "explicacion": "El apartado «Truco» destaca que el cuello de botella suele aparecer en el bus de datos cuando el ancho es insuficiente."}, {"id": 54, "tema": "2.3 Buses", "pregunta": "¿Qué solución habitual se propone en el texto para resolver un cuello de botella provocado por un ancho insuficiente?", "opciones": ["A) Disminuir la memoria para forzar transferencias de datos más pequeñas.", "B) Pasar a un bus de mayor ancho (como de 32 a 64 bits) o aumentar la frecuencia.", "C) Sustituir el bus de datos por dos buses de direcciones en paralelo."], "respuesta_correcta": "B", "explicacion": "El texto propone como solución pasar a un bus de mayor ancho (p. ej., de 32 a 64 bits) o aumentar la frecuencia."}, {"id": 55, "tema": "2.3 Buses", "pregunta": "En la primera demo interactiva, ¿qué tamaño y valor tiene el dato enviado por la CPU a la memoria?", "opciones": ["A) Una palabra de 16 bits con el valor 0x010.", "B) Cuatro bytes concatenados con el valor 0x5C.", "C) Un byte (8 bits) con el valor 0x3A."], "respuesta_correcta": "C", "explicacion": "En el código de la demo interactiva se define la constante data = 0x3A correspondiente a 8 bits (un byte)."}, {"id": 56, "tema": "2.3 Buses", "pregunta": "En el apartado de ejemplos prácticos, ¿qué aclaración técnica se realiza sobre el hardware real frente a la simulación?", "opciones": ["A) Que en hardware real el bus transporta bits y no «cadenas».", "B) Que los buses reales nunca presentan retardos temporales.", "C) Que los buses de datos solo pueden transferir caracteres ASCII."], "respuesta_correcta": "A", "explicacion": "El cuadro de aviso indica expresamente que en hardware real el bus transporta bits y no cadenas, siendo esto último una simplificación didáctica."}, {"id": 57, "tema": "2.3 Buses", "pregunta": "En el diagrama de bloques de la práctica guiada, ¿cuáles son las características del bus de direcciones?", "opciones": ["A) 64 bits y 250 MHz.", "B) 32 bits y 100 MHz.", "C) 16 bits y 33 MHz."], "respuesta_correcta": "B", "explicacion": "En el diagrama textual se asocia a la CPU con el Bus de direcciones de 32 bits y 100 MHz hacia la memoria."}, {"id": 58, "tema": "2.3 Buses", "pregunta": "En el diagrama de bloques de la práctica guiada, ¿qué ancho y velocidad tiene el bus de datos?", "opciones": ["A) 32 bits y 100 MHz.", "B) 128 bits y 500 MHz.", "C) 64 bits y 250 MHz."], "respuesta_correcta": "C", "explicacion": "El diagrama de bloques muestra que el Bus de datos tiene un ancho de 64 bits y opera a 250 MHz."}, {"id": 59, "tema": "2.3 Buses", "pregunta": "En los pasos a seguir de la práctica guiada, ¿qué valores de dirección y dato genera la CPU como ejemplo?", "opciones": ["A) Dirección 0x0010 y dato 0x5C.", "B) Dirección 0x3A y dato 0x0010.", "C) Dirección 0x5C y dato 0x2500."], "respuesta_correcta": "A", "explicacion": "El paso 3 de la práctica guiada establece como ejemplo generar una dirección 0x0010 y un dato 0x5C."}, {"id": 60, "tema": "2.3 Buses", "pregunta": "De acuerdo con la lógica de la práctica guiada, ¿cómo se coordina la transferencia entre el bus de direcciones y el de datos?", "opciones": ["A) El bus de datos envía primero el dato y luego el de direcciones indica la procedencia.", "B) El bus de direcciones muestra la dirección y, tras un retardo, la pasa al bus de datos, que transporta y escribe el dato en la memoria.", "C) Ambos buses transmiten simultáneamente sin retardo y la memoria decide qué bus procesar primero."], "respuesta_correcta": "B", "explicacion": "Según la lógica descrita, el bus de direcciones muestra la dirección y, tras un retardo, la pasa al bus de datos, el cual transporta el dato y lo escribe en la memoria."}, {"id": 61, "tema": "2.4 Componentes básicos", "pregunta": "¿Cuál es la función principal de la fuente de alimentación (PSU) según la nomenclatura técnica?", "opciones": ["A) Proteger el chasis y facilitar la ventilación interna.", "B) Convertir corriente alterna (AC) a corriente continua (DC) y distribuir energía.", "C) Suministrar datos directos a las ranuras PCIe de la placa base." acidad (TB), tipo (air/liquid) y latencia.", "C) TDP (W), certificación (80+) y modularidad."], "respuesta_correcta": "A", "explicacion": "Las propiedades críticas que definen a la placa base son su chipset, el factor de forma y los puertos I/O disponibles."}, {"id": 101, "tema": "2.1 Arquitectura Von Neumann - Práctico", "pregunta": "En el diagrama de la CPU, ¿qué registro [A] almacena la dirección de memoria de la siguiente instrucción que debe ejecutarse?", "opciones": ["A) Registro de Instrucción (IR)", "B) Contador de Programa (PC)", "C) Registro de Dirección de Memoria (MAR)"], "respuesta_correcta": "B", "explicacion": "El Contador de Programa (PC) almacena la dirección de memoria de la siguiente instrucción que debe ejecutarse."}, {"id": 102, "tema": "2.1 Arquitectura Von Neumann - Práctico", "pregunta": "En el diagrama de la CPU, ¿qué registro [B] contiene la instrucción actual que está siendo decodificada y ejecutada por la Unidad de Control?", "opciones": ["A) Registro de Instrucción (IR)", "B) Contador de Programa (PC)", "C) Registro de Búfer de Memoria (MBR)"], "respuesta_correcta": "A", "explicacion": "El Registro de Instrucción (IR) contiene la instrucción actual que se encuentra en fase de decodificación por la Unidad de Control."}, {"id": 103, "tema": "2.1 Arquitectura Von Neumann - Práctico", "pregunta": "En el diagrama de la CPU, ¿qué registro [C] guarda la dirección de memoria a la que se desea acceder?", "opciones": ["A) Registro de Búfer de Memoria (MBR)", "B) Contador de Programa (PC)", "C) Registro de Dirección de Memoria (MAR)"], "respuesta_correcta": "C", "explicacion": "El MAR (Memory Address Register) guarda la dirección de memoria a la que se desea acceder y la coloca en el bus de direcciones."}, {"id": 104, "tema": "2.1 Arquitectura Von Neumann - Práctico", "pregunta": "En el diagrama de la CPU, ¿qué registro [D] almacena temporalmente los datos o instrucciones que se transfieren entre la CPU y la memoria?", "opciones": ["A) Registro de let preguntasActivas = [];
let indiceActual = 0;
let respuestasUsuario = {}; // almacena { index: { opcionElegida, esCorrecta } }

function toggleTheme() {
  const body = document.body;
  const btn = document.getElementById('theme-toggle-btn');
  if (body.getAttribute('data-theme') === 'dark') {
    body.removeAttribute('data-theme');
    btn.textContent = '🌙 Oscuro';
  } else {
    body.setAttribute('data-theme', 'dark');
    btn.textContent = '☀️ Claro';
  }
}

function iniciarQuiz() {
  const cat = document.getElementById('cat-select').value;
  const orden = document.getElementById('order-select').value;

  // Filtrar preguntas
  if (cat === 'todas') {
    preguntasActivas = [...TODAS_LAS_PREGUNTAS];
  } else if (cat === 'test80') {
    preguntasActivas = TODAS_LAS_PREGUNTAS.filter(q => q.id >= 1 && q.id <= 80);
  } else if (cat === 'practicas') {
    preguntasActivas = TODAS_LAS_PREGUNTAS.filter(q => q.id >= 101);
  } else if (cat === 'tema21') {
    preguntasActivas = TODAS_LAS_PREGUNTAS.filter(q => q.tema.includes('2.1'));
  } else if (cat === 'tema22') {
    preguntasActivas = TODAS_LAS_PREGUNTAS.filter(q => q.tema.includes('2.2'));
  } else if (cat === 'tema23') {
    preguntasActivas = TODAS_LAS_PREGUNTAS.filter(q => q.tema.includes('2.3'));
  } else if (cat === 'tema24') {
    preguntasActivas = TODAS_LAS_PREGUNTAS.filter(q => q.tema.includes('2.4'));
  }

  if (preguntasActivas.length === 0) {
    alert('No hay preguntas en esta categoría.');
    return;
  }

  // Ordenar al azar si se seleccionó
  if (orden === 'azar') {
    for (let i = preguntasActivas.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [preguntasActivas[i], preguntasActivas[j]] = [preguntasActivas[j], preguntasActivas[i]];
    }
  }

  indiceActual = 0;
  respuestasUsuario = {};

  // Ocultar setup, mostrar quiz y barra de progreso
  document.getElementById('setup-panel').style.display = 'none';
  document.getElementById('quiz-header').style.display = 'flex';
  document.getElementById('progress-container').style.display = 'block';
  document.getElementById('quiz-container').style.display = 'block';
  document.getElementById('results-screen').style.display = 'none';

  cargarPregunta();
}

function cargarPregunta() {
  const q = preguntasActivas[indiceActual];
  
  // Actualizar contadores y barra
  document.getElementById('stat-counter').textContent = `Pregunta ${indiceActual + 1} / ${preguntasActivas.length}`;
  const aciertosTotales = Object.values(respuestasUsuario).filter(r => r.esCorrecta).length;
  document.getElementById('stat-score').textContent = `✅ Aciertos: ${aciertosTotales}`;
  
  const porcentaje = ((indiceActual + 1) / preguntasActivas.length) * 100;
  document.getElementById('progress-fill').style.width = porcentaje + '%';

  // Contenido de la tarjeta
  document.getElementById('card-tag').textContent = q.tema;
  document.getElementById('card-question').textContent = q.pregunta;

  const optionsContainer = document.getElementById('card-options');
  optionsContainer.innerHTML = '';

  const explanationBox = document.getElementById('card-explanation');
  explanationBox.textContent = "💡 " + q.explicacion;

  const respuestaGuardada = respuestasUsuario[indiceActual];

  q.opciones.forEach(opcion => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opcion;

    const letraOpcion = opcion.charAt(0).toUpperCase();
    const letraCorrecta = q.respuesta_correcta.trim().toUpperCase();

    if (respuestaGuardada) {
      btn.disabled = true;
      if (letraOpcion === letraCorrecta) {
        btn.classList.add('correct');
      }
      if (respuestaGuardada.opcionElegida === opcion && letraOpcion !== letraCorrecta) {
        btn.classList.add('incorrect');
      }
    } else {
      btn.onclick = () => seleccionarRespuesta(opcion, letraOpcion, letraCorrecta, q);
    }

    optionsContainer.appendChild(btn);
  });

  if (respuestaGuardada) {
    explanationBox.classList.add('visible');
    document.getElementById('btn-next').disabled = false;
  } else {
    explanationBox.classList.remove('visible');
    document.getElementById('btn-next').disabled = true;
  }

  // Botones navegación
  document.getElementById('btn-prev').disabled = indiceActual === 0;
}

function seleccionarRespuesta(opcionTexto, letraOpcion, letraCorrecta, q) {
  const esCorrecta = (letraOpcion === letraCorrecta);
  respuestasUsuario[indiceActual] = { opcionElegida: opcionTexto, esCorrecta };

  const botones = document.querySelectorAll('.option-btn');
  botones.forEach(btn => {
    btn.disabled = true;
    const txt = btn.textContent;
    const l = txt.charAt(0).toUpperCase();
    if (l === letraCorrecta) {
      btn.classList.add('correct');
    }
    if (txt === opcionTexto && !esCorrecta) {
      btn.classList.add('incorrect');
    }
  });

  document.getElementById('card-explanation').classList.add('visible');
  document.getElementById('btn-next').disabled = false;

  // Actualizar marcador en tiempo real
  const aciertosTotales = Object.values(respuestasUsuario).filter(r => r.esCorrecta).length;
  document.getElementById('stat-score').textContent = `✅ Aciertos: ${aciertosTotales}`;
}

function siguientePregunta() {
  if (indiceActual < preguntasActivas.length - 1) {
    indiceActual++;
    cargarPregunta();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    mostrarResultados();
  }
}

function preguntaAnterior() {
  if (indiceActual > 0) {
    indiceActual--;
    cargarPregunta();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function mostrarResultados() {
  document.getElementById('quiz-header').style.display = 'none';
  document.getElementById('progress-container').style.display = 'none';
  document.getElementById('quiz-container').style.display = 'none';

  const total = preguntasActivas.length;
  const aciertos = Object.values(respuestasUsuario).filter(r => r.esCorrecta).length;
  const porcentaje = Math.round((aciertos / total) * 100);

  document.getElementById('final-score-circle').textContent = porcentaje + '%';
  document.getElementById('final-message').textContent = `Has acertado ${aciertos} de ${total} preguntas en esta sesión.`;
  document.getElementById('results-screen').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' }>);
}

function reiniciarSetup() {
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('setup-panel').style.display = 'grid';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
