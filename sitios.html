<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background: #fafafa;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 1100px;
        }

        /* ---------- Barra superior (idéntica al horario) ---------- */
        .topbar {
            display: flex;
            gap: 4px;
            background: #fff;
            border: 1px solid #ececec;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 50px;
        }

        .topbar a {
            flex: 1;
            text-align: center;
            text-decoration: none;
            padding: 10px 0;
            font-size: 0.82rem;
            color: #777;
            border-radius: 6px;
            transition: all 0.15s;
            font-weight: 500;
        }

        .topbar a:hover { color: #000; background: #f5f5f5; }
        .topbar a.activo { background: #222; color: #fff; }

        /* ---------- Título aula ---------- */
        .titulo-aula {
            text-align: center;
            margin-bottom: 50px;
        }

        .profe {
            display: inline-block;
            background: #222;
            color: #fff;
            padding: 20px 60px;
            border-radius: 20px;
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        /* ---------- Grid del aula ---------- */
        .aula {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 60px;
            padding: 0 10px;
        }

        .bloque {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .fila {
            display: grid;
            gap: 16px;
        }

        .fila-5 { grid-template-columns: repeat(5, 1fr); }
        .fila-4 { grid-template-columns: repeat(4, 1fr); }
        .fila-3 { grid-template-columns: repeat(3, 1fr); }

        /* ---------- Tarjeta alumno ---------- */
        .alumno {
            background: #fff;
            color: #222;
            padding: 20px 10px;
            border-radius: 18px;
            text-align: center;
            font-size: 1.02rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            border: 1px solid #eee;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
            cursor: default;
        }

        .alumno:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border-color: #222;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 950px) {
            .aula { gap: 30px; }
            .alumno { font-size: 0.95rem; padding: 18px 6px; }
            .profe { font-size: 1.25rem; padding: 18px 45px; }
        }

        @media (max-width: 720px) {
            body { padding: 24px 14px; }
            .topbar { margin-bottom: 32px; }
            .titulo-aula { margin-bottom: 32px; }
            .fila { gap: 10px; }
            .bloque { gap: 10px; }
            .alumno { font-size: 0.85rem; padding: 14px 4px; border-radius: 14px; }
            .profe { font-size: 1.1rem; padding: 16px 36px; border-radius: 16px; }
        }

        @media (max-width: 560px) {
            body { padding: 16px 10px; }
            .topbar { padding: 3px; margin-bottom: 24px; }
            .topbar a { font-size: 0.7rem; padding: 7px 0; }
            .aula { flex-direction: column; gap: 16px; align-items: stretch; padding: 0; }
            .fila-5 { grid-template-columns: repeat(3, 1fr); }
            .fila-4 { grid-template-columns: repeat(2, 1fr); }
            .fila-3 { grid-template-columns: repeat(3, 1fr); }
            .alumno { font-size: 0.78rem; padding: 12px 4px; border-radius: 12px; }
            .profe { font-size: 1rem; padding: 14px 32px; }
        }
    </style>
</head>
<body>
    <div class="contenedor">

        <nav class="topbar">
            <a href="horario.html">Horario</a>
            <a href="sitios.html" class="activo">Sitios</a>
