<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background: #fafafa;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 1100px;
        }

        /* ---------- Barra superior (idéntica al resto) ---------- */
        .topbar {
            display: flex;
            gap: 4px;
            background: #fff;
            border: 1px solid #ececec;
            border-radius: 10px;
            padding: 4px;
        }

        .topbar a {
            flex: 1;
            text-align: center;
            text-decoration: none;
            padding: 10px 0;
            font-size: 0.82rem;
            color: #777;
            border-radius: 6px;
            transition: all 0.15s;
            font-weight: 500;
        }

        .topbar a:hover { color: #000; background: #f5f5f5; }
        .topbar a.activo { background: #222; color: #fff; }

        /* ---------- Responsive ---------- */
        @media (max-width: 480px) {
            body { padding: 16px 10px; }
            .topbar { padding: 3px; }
            .topbar a { font-size: 0.68rem; padding: 7px 0; }
        }
    </style>
</head>
<body>
    <div class="contenedor">

        <nav class="topbar">
            <a href="horario.html">Horario</a>
            <a href="sitios.html">Sitios</a>
            <a href="calendario.html">Calendario</a>
            <a href="reloj.html">Reloj</a>
        </nav>

    </div>
</body>
</html>
